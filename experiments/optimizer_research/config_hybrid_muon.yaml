# experiments/optimizer_research/config_hybrid_muon.yaml
# Research configuration example for Post-50M Hybrid Muon + AdamW Bakeoff
# NOTE: Marked strictly as INITIAL EXPERIMENT VALUES. Not to be executed during active baseline.

experiment:
  name: "jarvis_hybrid_muon_bakeoff"
  stage: "stage_1_smoke_test"
  description: "Controlled evaluation of Hybrid Muon + AdamW vs AdamW baseline on RTX 5070 12GB"

model:
  checkpoint_init: "experiments/extended_train/ckpt_step_0004284_best.pt"
  d_model: 1024
  n_layers: 24
  n_heads: 16
  num_experts: 4
  top_k: 2
  max_seq_len: 512

optimizer:
  name: "hybrid_muon"
  
  # Group 0: 2D Hidden Transformations (83.00% of parameters: Attention Q,K,V,Out and MoE W1,W2)
  muon:
    lr: 2.0e-3               # INITIAL EXPERIMENT VALUE (calibrated for master weights sigma ~ 0.025)
    min_lr: 2.0e-4           # 10% cosine decay floor
    momentum: 0.95           # Momentum smoothing coefficient
    weight_decay: 0.05       # Decoupled weight decay
    ns_steps: 5              # 5th-order Newton-Schulz polynomial iterations
    aspect_scale: true       # Moonshot aspect-ratio scaling: alpha(M, N) = 0.2 * max(1.0, sqrt(M / N))

  # Group 1: 1D Vectors, Scalars, Embeddings, Head, Routers (17.00% of parameters)
  adamw:
    lr: 1.5e-4               # INITIAL EXPERIMENT VALUE (matches validated AdamW baseline)
    min_lr: 1.5e-5           # 10% cosine decay floor
    betas: [0.90, 0.95]
    weight_decay: 0.10
    eps: 1.0e-8

scheduler:
  type: "cosine_warmup"
  warmup_steps: 2000
  decay: "cosine"

training:
  micro_batch: 2
  accum_steps: 4
  effective_batch: 8         # 4,096 tokens per update
  clip_grad_norm: 1.0
  precision: "bfloat16"
